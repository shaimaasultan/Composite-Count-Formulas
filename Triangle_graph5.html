<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Scaled Symbolic Euclidean Diagram</title>
<style>
  svg { background:#fafafa; border:1px solid #ccc; }
  text { font-family:Arial; font-size:12px; }
  .node { fill:black; }
  .hyp { stroke:black; stroke-width:2; }
  .tri { stroke:#0074D9; stroke-width:1.5; fill:none; }
  .label { fill:#111; }
</style>
</head>
<body>

<svg width="1100" height="600">

  <!-- Horizontal unit L = 150 -->
  <!-- A=100, B=250, C=400, F=550, I=700 -->
  <!-- Lower nodes share same x positions -->

  <!-- Vertical line length = 300 -->
  <!-- Upper nodes around y=100, lower nodes around y=400 -->

  <!-- Main hypotenuse A--I -->
  <line x1="100" y1="250" x2="700" y2="250" class="hyp" />

  <!-- A and I -->
  <circle cx="100" cy="250" r="4" class="node" />
  <text x="90" y="235" class="label">A</text>

  <circle cx="700" cy="250" r="4" class="node" />
  <text x="705" y="235" class="label">I</text>

  <!-- Upper nodes: B, C, F -->
  <circle cx="250" cy="100" r="4" class="node" />
  <text x="245" y="85" class="label">B (height = B²)</text>

  <!-- C shifted upward (not centered on hypotenuse) -->
  <circle cx="400" cy="60" r="4" class="node" />
  <text x="395" y="45" class="label">C (height = C²)</text>

  <circle cx="550" cy="100" r="4" class="node" />
  <text x="545" y="85" class="label">F (height = F²)</text>

  <!-- Lower nodes: H, G, D -->
  <circle cx="250" cy="400" r="4" class="node" />
  <text x="245" y="420" class="label">H (height = H²)</text>

  <!-- G shifted downward (not centered on hypotenuse) -->
  <circle cx="400" cy="460" r="4" class="node" />
  <text x="395" y="480" class="label">G (height = G²)</text>

  <circle cx="550" cy="400" r="4" class="node" />
  <text x="545" y="420" class="label">D (height = D²)</text>

  <!-- Triangle labels -->
  <text x="350" y="235" class="label">A² + I² = 2K²</text>
  <text x="260" y="260" class="label">B² + H² = 2K²</text>
  <text x="410" y="260" class="label">C² + G² = 2K²</text>
  <text x="560" y="260" class="label">F² + D² = 2K²</text>

  <!-- Triangle B-H -->
  <line x1="250" y1="100" x2="250" y2="400" class="tri" />
  <line x1="250" y1="100" x2="100" y2="250" class="tri" />
  <line x1="250" y1="400" x2="700" y2="250" class="tri" />

  <!-- Triangle C-G (shifted) -->
  <line x1="400" y1="60" x2="400" y2="460" class="tri" />
  <line x1="400" y1="60" x2="100" y2="250" class="tri" />
  <line x1="400" y1="460" x2="700" y2="250" class="tri" />

  <!-- Triangle F-D -->
  <line x1="550" y1="100" x2="550" y2="400" class="tri" />
  <line x1="550" y1="100" x2="100" y2="250" class="tri" />
  <line x1="550" y1="400" x2="700" y2="250" class="tri" />

</svg>

</body>
</html>
