<!DOCTYPE html>
<meta charset="utf-8">
<style>
  body { margin:0; overflow:hidden; }
  text { font-family: sans-serif; font-size: 14px; }
  circle { cursor: pointer; }
</style>

<svg width="1200" height="800"></svg>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>

// Node groups
const baseNodes = ["A","B","C","D","F","G","H","I"];
const sum2Node = "SUM2";
const sum3Nodes = ["SUM3_ABC","SUM3_ADG","SUM3_CFI","SUM3_GHI"];

// Build node list with colors
const nodes = [
  ...baseNodes.map(id => ({id, color:"#66aaff"})),      // blue
  {id: sum2Node, color:"#ff4444"},                      // red
  ...sum3Nodes.map(id => ({id, color:"#ffaa33"}))       // orange
];

// Build directed edges (weight = 1)
let links = [];

// Pairwise relations → bidirectional through SUM2
baseNodes.forEach(n1 => {
  baseNodes.forEach(n2 => {
    if (n1 !== n2) {
      links.push({source:n1, target:sum2Node, weight:1});
      links.push({source:sum2Node, target:n2, weight:1});
    }
  });
});

// Triple relations → bidirectional
const triples = {
  "SUM3_ADG": ["A","D","G"],
  "SUM3_CFI": ["C","F","I"],
  "SUM3_ABC": ["A","B","C"],
  "SUM3_GHI": ["G","H","I"]
};

for (let Znode in triples) {
  triples[Znode].forEach(n => {
    links.push({source:n, target:Znode, weight:1});
    links.push({source:Znode, target:n, weight:1});
  });
}

// D3 Force Layout
const svg = d3.select("svg");
const width = window.innerWidth;
const height = window.innerHeight;

const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(140))
  .force("charge", d3.forceManyBody().strength(-600))
  .force("center", d3.forceCenter(width/2, height/2));

const link = svg.append("g")
  .selectAll("line")
  .data(links)
  .enter().append("line")
  .attr("stroke", "#999")
  .attr("stroke-width", 2)
  .attr("marker-end", "url(#arrow)");

svg.append("defs").append("marker")
  .attr("id", "arrow")
  .attr("viewBox", "0 -5 10 10")
  .attr("refX", 20)
  .attr("refY", 0)
  .attr("markerWidth", 6)
  .attr("markerHeight", 6)
  .attr("orient", "auto")
  .append("path")
  .attr("d", "M0,-5L10,0L0,5")
  .attr("fill", "#999");

// Edge weight labels
const weightLabel = svg.append("g")
  .selectAll("text")
  .data(links)
  .enter().append("text")
  .text(d => d.weight)
  .attr("font-size", 12)
  .attr("fill", "#444");

const node = svg.append("g")
  .selectAll("circle")
  .data(nodes)
  .enter().append("circle")
  .attr("r", 22)
  .attr("fill", d => d.color)
  .call(drag(simulation));

const label = svg.append("g")
  .selectAll("text")
  .data(nodes)
  .enter().append("text")
  .text(d => d.id)
  .attr("text-anchor", "middle")
  .attr("dy", 5);

simulation.on("tick", () => {
  link
    .attr("x1", d => d.source.x)
    .attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x)
    .attr("y2", d => d.target.y);

  node
    .attr("cx", d => d.x)
    .attr("cy", d => d.y);

  label
    .attr("x", d => d.x)
    .attr("y", d => d.y);

  weightLabel
    .attr("x", d => (d.source.x + d.target.x) / 2)
    .attr("y", d => (d.source.y + d.target.y) / 2);
});

function drag(simulation) {
  function dragstarted(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x;
    d.fy = d.y;
  }
  function dragged(event, d) {
    d.fx = event.x;
    d.fy = event.y;
  }
  function dragended(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null;
    d.fy = null;
  }
  return d3.drag()
    .on("start", dragstarted)
    .on("drag", dragged)
    .on("end", dragended);
}

</script>
