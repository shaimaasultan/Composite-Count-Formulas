<svg viewBox="0 0 820 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Stacked composite shape for X=7: constant width 2X, vertical step 6X</title>
<desc>Four horizontal bars, each spanning from X*(6k-1) to X*(6k+1), all the same width 2X=14, stacked with a constant vertical step of 6X=42 between rows k=1 through k=4</desc>
<rect x="0" y="0" width="820" height="480" fill="var(--bg,#0b0f14)"/>

<text x="410" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="var(--fg,#e6edf3)" font-family="ui-sans-serif,system-ui">X = 7 -- width is ALWAYS 2X = 14, height (step) is ALWAYS 6X = 42</text>

<!-- value axis -->
<line x1="120" y1="60" x2="120" y2="440" stroke="#5b6b7a" stroke-width="2"/>
<text x="120" y="50" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="ui-monospace,monospace">value axis</text>

<!-- k=1: 35 to 49, width=14 -->
<rect x="180" y="90" width="140" height="60" fill="#e63946" opacity="0.85"/>
<text x="250" y="125" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0f14" font-family="ui-monospace,monospace">35 -- 49</text>
<text x="60" y="125" text-anchor="end" font-size="13" fill="#94a3b8" font-family="ui-sans-serif,system-ui">k=1</text>
<text x="335" y="115" font-size="12" fill="#e63946" font-family="ui-monospace,monospace">width=2X=14</text>

<!-- vertical step arrow between k=1 and k=2 -->
<line x1="150" y1="150" x2="150" y2="192" stroke="#5b6b7a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="20" y="176" font-size="12" fill="#5b6b7a" font-family="ui-monospace,monospace">6X=42</text>

<!-- k=2: 77 to 91 -->
<rect x="180" y="192" width="140" height="60" fill="#f4a261" opacity="0.85"/>
<text x="250" y="227" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0f14" font-family="ui-monospace,monospace">77 -- 91</text>
<text x="60" y="227" text-anchor="end" font-size="13" fill="#94a3b8" font-family="ui-sans-serif,system-ui">k=2</text>

<line x1="150" y1="252" x2="150" y2="294" stroke="#5b6b7a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="20" y="278" font-size="12" fill="#5b6b7a" font-family="ui-monospace,monospace">6X=42</text>

<!-- k=3: 119 to 133 -->
<rect x="180" y="294" width="140" height="60" fill="#2a9d8f" opacity="0.85"/>
<text x="250" y="329" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0f14" font-family="ui-monospace,monospace">119 -- 133</text>
<text x="60" y="329" text-anchor="end" font-size="13" fill="#94a3b8" font-family="ui-sans-serif,system-ui">k=3</text>

<line x1="150" y1="354" x2="150" y2="396" stroke="#5b6b7a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="20" y="380" font-size="12" fill="#5b6b7a" font-family="ui-monospace,monospace">6X=42</text>

<!-- k=4: 161 to 175 -->
<rect x="180" y="396" width="140" height="60" fill="#457b9d" opacity="0.85"/>
<text x="250" y="431" text-anchor="middle" font-size="15" font-weight="700" fill="#0b0f14" font-family="ui-monospace,monospace">161 -- 175</text>
<text x="60" y="431" text-anchor="end" font-size="13" fill="#94a3b8" font-family="ui-sans-serif,system-ui">k=4</text>

<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="#5b6b7a"/>
</marker>
</defs>

<!-- annotation: every bar is identical width, only position shifts -->
<text x="600" y="115" font-size="13" fill="#94a3b8" font-family="ui-sans-serif,system-ui">every bar: same</text>
<text x="600" y="132" font-size="13" fill="#94a3b8" font-family="ui-sans-serif,system-ui">width = 2X = 14</text>
<line x1="590" y1="145" x2="590" y2="415" stroke="#5b6b7a" stroke-width="1" stroke-dasharray="4,4"/>
<text x="600" y="290" font-size="13" fill="#94a3b8" font-family="ui-sans-serif,system-ui">stack advances by</text>
<text x="600" y="307" font-size="13" fill="#94a3b8" font-family="ui-sans-serif,system-ui">6X = 42 each row</text>

<text x="410" y="465" text-anchor="middle" font-size="14" fill="#cbd5e1" font-family="ui-sans-serif,system-ui">bar_k = [X*(6k-1), X*(6k+1)], width=2X constant, row offset=6kX (6X per step)</text>
</svg>
